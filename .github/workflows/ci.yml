name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_QUIET: true
  CARGO_BUILD_JOBS: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOBUF_VERSION=3.20.3
          curl -sLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOBUF_VERSION}/protoc-${PROTOBUF_VERSION}-linux-x86_64.zip"
          mkdir -p /usr/local/include /usr/local/bin
          unzip -o "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip" bin/protoc -d /usr/local/bin
          unzip -o "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip" 'include/*' -d /usr/local/include
          rm "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p catga-core --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-core-macros --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-cluster --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-axum --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-redis --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-nats --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-sorock --all-targets --all-features -- -D warnings
      - run: cargo test --doc -p catga-core --all-features
      - run: cargo test --doc -p catga-core-macros --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc -p catga-core --all-features --no-deps
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo check -p catga-examples --bins

  tests:
    runs-on: ubuntu-latest
    needs: quality
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOBUF_VERSION=3.20.3
          curl -sLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOBUF_VERSION}/protoc-${PROTOBUF_VERSION}-linux-x86_64.zip"
          mkdir -p /usr/local/include /usr/local/bin
          unzip -o "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip" bin/protoc -d /usr/local/bin
          unzip -o "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip" 'include/*' -d /usr/local/include
          rm "protoc-${PROTOBUF_VERSION}-linux-x86_64.zip"
      - uses: Swatinem/rust-cache@v2
      # Docker/service-dependent E2E tests are #[ignore]d and skip by default;
      # they run only in the release workflow (tag push or manual dispatch).
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace --all-features
