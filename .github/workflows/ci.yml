name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: true
  CARGO_BUILD_JOBS: 2

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p catga-core --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-core-macros --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-cluster --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-axum --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-redis --all-targets --all-features -- -D warnings
      - run: cargo clippy -p catga-nats --all-targets --all-features -- -D warnings
      - run: cargo test --doc -p catga-core --all-features
      - run: cargo test --doc -p catga-core-macros --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc -p catga-core --all-features --no-deps
      - run: cargo check --examples --workspace --all-features
      - run: cargo check -p catga-examples --bins

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run E2E tests with coverage
        run: bash scripts/e2e.sh --profile core --jobs 2 --coverage --keep-services
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --fail-under-lines 80 --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
