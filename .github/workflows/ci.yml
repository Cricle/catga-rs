name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --doc --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: cargo check --examples --workspace --all-features
      - run: cargo check -p catga-examples --bins
      - name: Validate Docker Compose E2E runner
        run: bash scripts/e2e.sh --profile full --validate-only

  distributed-todo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Run distributed Todo black-box and restart verification
        run: bash examples/distributed-todo/verify.sh

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cov
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run strict workspace coverage gates
        run: >-
          bash scripts/coverage.sh --profile ${{ github.event_name == 'pull_request' && 'core' || 'full' }}
          --e2e-jobs 2
          --required-line-coverage 80
          --required-region-coverage 80
          --required-e2e-pass-percentage 95
          --health-timeout-seconds 60
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Upload E2E results and logs from the coverage gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            target/coverage/e2e-results.json
            target/e2e-logs
          if-no-files-found: warn
          retention-days: 14
