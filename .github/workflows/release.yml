name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Create a draft release for performance assets
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Run Docker E2E performance suite
        id: performance
        continue-on-error: true
        run: >-
          bash scripts/performance.sh --profile full
          --output-directory target/release-performance
      - name: Package complete performance diagnostics
        if: ${{ always() }}
        run: |
          tar -C target -czf "target/catga-e2e-performance-${GITHUB_REF_NAME}.tar.gz" release-performance
      - name: Upload performance diagnostics to workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-performance-${{ github.ref_name }}
          path: |
            target/release-performance
            target/catga-e2e-performance-${{ github.ref_name }}.tar.gz
          if-no-files-found: warn
          retention-days: 90
      - name: Upload performance diagnostics to the draft release
        if: ${{ always() }}
        run: |
          assets=("target/catga-e2e-performance-${GITHUB_REF_NAME}.tar.gz")
          for result in target/release-performance/performance.json target/release-performance/summary.txt; do
            [[ -f "$result" ]] && assets+=("$result")
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Fail the release gate when E2E performance fails
        if: ${{ steps.performance.outcome != 'success' }}
        run: exit 1

  publish:
    needs: performance
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: |
          for package in catga-macros catga-core catga-codec-memorypack catga-codec-bincode catga-flow catga-memory catga-redis catga-flow-store catga-scheduler-tokio-cron catga-nats catga-robustmq catga-cluster catga-axum catga-testing; do
            version="$(cargo pkgid -p "$package")"
            version="${version##*#}"
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/$package/$version" > /dev/null; then
              echo "$package v$version is already published; skipping"
              continue
            fi

            cargo publish --dry-run -p "$package"
            cargo publish -p "$package"
          done
      - name: Publish the verified GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
