name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Create a draft release for performance assets
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Run Docker E2E performance suite
        id: performance
        continue-on-error: true
        run: >-
          bash scripts/performance.sh --profile full
          --output-directory target/release-performance
      - name: Package complete performance diagnostics
        if: ${{ always() }}
        run: |
          tar -C target -czf "target/catga-e2e-performance-${GITHUB_REF_NAME}.tar.gz" release-performance
      - name: Upload performance diagnostics to workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-performance-${{ github.ref_name }}
          path: |
            target/release-performance
            target/catga-e2e-performance-${{ github.ref_name }}.tar.gz
          if-no-files-found: warn
          retention-days: 90
      - name: Upload performance diagnostics to the draft release
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          assets=("target/catga-e2e-performance-${GITHUB_REF_NAME}.tar.gz")
          assets+=(target/release-performance/*.json)
          for result in target/release-performance/summary.md target/release-performance/summary.txt; do
            [[ -f "$result" ]] && assets+=("$result")
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          if [[ "${{ steps.performance.outcome }}" == 'success' ]]; then
            notes='target/release-performance/release-notes.md'
            base_notes='target/release-performance/release-notes-base.md'
            gh release view "$GITHUB_REF_NAME" --json body --jq .body >"$notes"
            awk '/<!-- catga-performance-summary -->/{exit} {print}' "$notes" >"$base_notes"
            {
              cat "$base_notes"
              printf '\n\n<!-- catga-performance-summary -->\n\n'
              cat target/release-performance/summary.md
            } >"$notes"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
      - name: Fail the release gate when E2E performance fails
        if: ${{ steps.performance.outcome != 'success' }}
        run: exit 1

  publish:
    needs: performance
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --no-default-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: |
          release_version="${GITHUB_REF_NAME#v}"
          packages=(catga-macros catga-core catga-memorypack-derive catga-codec-memorypack catga-codec-bincode catga-flow catga-memory catga-redis catga-flow-store catga-scheduler-tokio-cron catga-nats catga-robustmq catga-cluster catga-axum catga-auto catga-testing)
          for package in "${packages[@]}"; do
            manifest_version="$(cargo pkgid -p "$package")"
            manifest_version="${manifest_version##*@}"
            manifest_version="${manifest_version##*#}"
            test "${release_version}" = "${manifest_version}"
          done
          echo "publishing workspace version ${release_version}"
          crates_user_agent="catga-release/${release_version} (https://github.com/Cricle/catga-rs)"

          publish_with_rate_limit_retry() {
            local package="$1"
            local attempt=1
            local max_attempts=4

            while (( attempt <= max_attempts )); do
              local publish_log
              publish_log="$(mktemp)"
              if cargo publish -p "$package" >"$publish_log" 2>&1; then
                cat "$publish_log"
                rm -f "$publish_log"
                return 0
              fi

              cat "$publish_log" >&2
              if ! grep -Fq "status 429 Too Many Requests" "$publish_log" || (( attempt == max_attempts )); then
                rm -f "$publish_log"
                return 1
              fi

              rm -f "$publish_log"
              echo "crates.io rate limited $package; retrying in five minutes (attempt $attempt/$max_attempts)"
              sleep 300
              ((attempt += 1))
            done
          }

          published_new_package=false
          for package in "${packages[@]}"; do
            package_id="$(cargo pkgid -p "$package")"
            version="${package_id##*@}"
            version="${version##*#}"
            http_status="$(curl --silent --show-error --location --retry 3 \
              --user-agent "$crates_user_agent" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$package/$version")"
            case "$http_status" in
              200)
                echo "$package v$version is already published; skipping"
                continue
                ;;
              404) ;;
              *)
                echo "unexpected crates.io status $http_status for $package v$version" >&2
                exit 1
                ;;
            esac

            if [[ "$published_new_package" == true ]]; then
              echo "waiting five minutes before publishing $package to respect crates.io new-crate limits"
              sleep 300
            fi
            cargo publish --dry-run -p "$package"
            publish_with_rate_limit_retry "$package"
            published_new_package=true
          done
      - name: Publish the verified GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
