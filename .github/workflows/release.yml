name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_QUIET: true

jobs:
  performance:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Create a draft release for performance assets
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Run Docker E2E performance suite
        id: performance
        continue-on-error: true
        run: >-
          bash scripts/performance.sh --profile full
          --output-directory target/release-performance

  publish:
    needs: performance
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_KEY }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_QUIET: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --no-default-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --doc --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: |
          release_version="${GITHUB_REF_NAME#v}"
          packages=(catga-memorypack-derive catga-core-macros catga-core catga-sorock catga-redis catga-nats catga-robustmq catga-flow-store catga-cluster catga-axum)
          for package in "${packages[@]}"; do
            manifest_version="$(cargo pkgid -p "$package")"
            manifest_version="${manifest_version##*@}"
            manifest_version="${manifest_version##*#}"
            test "${release_version}" = "${manifest_version}"
          done
          echo "publishing workspace version ${release_version}"
          crates_user_agent="catga-release/${release_version} (https://github.com/Cricle/catga-rs)"

          publish_with_rate_limit_retry() {
            local package="$1"
            local attempt=1
            local max_attempts=4

            while (( attempt <= max_attempts )); do
              local publish_log
              publish_log="$(mktemp)"
              if cargo publish -p "$package" >"$publish_log" 2>&1; then
                cat "$publish_log"
                rm -f "$publish_log"
                return 0
              fi

              cat "$publish_log" >&2
              if ! grep -Fq "status 429 Too Many Requests" "$publish_log" || (( attempt == max_attempts )); then
                rm -f "$publish_log"
                return 1
              fi

              rm -f "$publish_log"
              echo "crates.io rate limited $package; retrying in five minutes (attempt $attempt/$max_attempts)"
              sleep 300
              ((attempt += 1))
            done
          }

          published_new_package=false
          for package in "${packages[@]}"; do
            package_id="$(cargo pkgid -p "$package")"
            version="${package_id##*@}"
            version="${version##*#}"
            http_status="$(curl --silent --show-error --location --retry 3 \
              --user-agent "$crates_user_agent" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$package/$version")"
            case "$http_status" in
              200)
                echo "$package v$version is already published; skipping"
                continue
                ;;
              404) ;;
              *)
                echo "unexpected crates.io status $http_status for $package v$version" >&2
                exit 1
                ;;
            esac

            if [[ "$published_new_package" == true ]]; then
              echo "waiting five minutes before publishing $package to respect crates.io new-crate limits"
              sleep 300
            fi
            cargo publish --dry-run -p "$package"
            publish_with_rate_limit_retry "$package"
            published_new_package=true
          done
      - name: Publish the verified GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
