[workspace]
members = [
    "crates/catga-core",
    "crates/catga-flow-store",
    "crates/catga-memorypack-derive",
    "crates/catga-raft",
    "crates/catga-axum",
    "crates/catga-nats",
    "crates/catga-redis",
    "crates/catga-robustmq",
    "tests",
    "examples",
    "examples/distributed-kv",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Cricle/Catga"
description = "Composable CQRS, event-sourcing, workflow, and distributed-runtime components for Rust"

[workspace.dependencies]
catga-axum = { path = "crates/catga-axum", version = "0.2.0" }
catga-core = { path = "crates/catga-core", version = "0.2.0" }
catga-flow-store = { path = "crates/catga-flow-store", version = "0.2.0" }
catga-memorypack-derive = { path = "crates/catga-memorypack-derive", version = "0.2.0" }
catga-nats = { path = "crates/catga-nats", version = "0.2.0" }
catga-raft = { path = "crates/catga-raft", version = "0.2.0" }
catga-redis = { path = "crates/catga-redis", version = "0.2.0" }
catga-robustmq = { path = "crates/catga-robustmq", version = "0.2.0" }
async-trait = "0.1"
bincode = { version = "2", features = ["serde"] }
bincode-next = "3"
bytes = "1.8"
chrono = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }
dashmap = "6"
fnv = "1.0"
futures = "0.3"
serde = "1"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
# Every workspace member inherits this lint; public APIs must carry Rustdoc.
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
