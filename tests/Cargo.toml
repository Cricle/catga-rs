[package]
name = "catga-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dependencies]
async-trait = "0.1"
catga-core = { path = "../crates/catga-core" }
catga-memory = { path = "../crates/catga-memory" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "result"
path = "result.rs"

[[test]]
name = "message"
path = "message.rs"

[[test]]
name = "mediator"
path = "mediator.rs"

[[test]]
name = "batch_stream"
path = "batch_stream.rs"

[[test]]
name = "reliability_contracts"
path = "reliability_contracts.rs"

[[test]]
name = "memory_outbox"
path = "memory_outbox.rs"

[[test]]
name = "memory_transport"
path = "memory_transport.rs"

[[test]]
name = "macros"
path = "macros.rs"
