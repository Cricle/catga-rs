[package]
name = "catga-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
catga-axum = { path = "../crates/catga-axum" }
catga-core = { path = "../crates/catga-core" }
catga-flow = { path = "../crates/catga-flow" }
catga-codec-postcard = { path = "../crates/catga-codec-postcard" }
catga-cluster = { path = "../crates/catga-cluster" }
catga-memory = { path = "../crates/catga-memory" }
catga-nats = { path = "../crates/catga-nats" }
catga-redis = { path = "../crates/catga-redis" }
catga-robustmq = { path = "../crates/catga-robustmq" }
futures = "0.3"
robustmq = "1"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "1", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"

[[test]]
name = "result"
path = "result.rs"

