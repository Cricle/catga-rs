[package]
name = "catga-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dependencies]
async-trait = "0.1"
async-nats = "0.50"
axum = "0.8"
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["tds73", "with-tokio"] }
catga-axum = { workspace = true }
catga-core = { workspace = true }
catga-flow = { workspace = true }
catga-flow-store = { workspace = true, features = ["sqlite", "mysql", "postgres", "mssql"] }
catga-codec-memorypack = { workspace = true }
catga-cluster = { workspace = true }
catga-memory = { workspace = true }
catga-nats = { workspace = true }
catga-redis = { workspace = true }
catga-robustmq = { workspace = true }
catga-testing = { workspace = true }
futures = "0.3"
hex = "0.4"
metrics = "0.24"
robustmq = "1"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
protobuf = "2.28"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
redis = { version = "1", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
testcontainers = "0.27"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"

