[package]
name = "catga-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dependencies]
async-trait = "0.1"
async-nats = "0.50"
axum = "0.8"
catga-axum = { path = "../crates/catga-axum" }
catga-core = { path = "../crates/catga-core" }
catga-flow = { path = "../crates/catga-flow" }
catga-flow-store = { path = "../crates/catga-flow-store", features = ["mysql", "postgres", "mssql"] }
catga-codec-memorypack = { path = "../crates/catga-codec-memorypack" }
catga-cluster = { path = "../crates/catga-cluster" }
catga-memory = { path = "../crates/catga-memory" }
catga-nats = { path = "../crates/catga-nats" }
catga-redis = { path = "../crates/catga-redis" }
catga-robustmq = { path = "../crates/catga-robustmq" }
catga-testing = { path = "../crates/catga-testing" }
futures = "0.3"
hex = "0.4"
metrics = "0.24"
robustmq = "1"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
protobuf = "2.28"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
redis = { version = "1", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
testcontainers = "0.27"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"

