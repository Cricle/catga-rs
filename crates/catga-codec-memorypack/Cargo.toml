[package]
name = "catga-codec-memorypack"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[dependencies]
async-trait = "0.1"
catga-core = { path = "../catga-core" }
byteorder = { version = "1.5.0", features = ["i128"] }
memorypack-derive = { version = "1.1.0", path = "memorypack-derive", optional = true }
simdutf8 = "0.1.5"
thiserror = "2.0"

ahash = { version = "0.8", features = ["compile-time-rng"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
glam = { version = "0.29", features = ["serde", "fast-math"], optional = true }
half = { version = "2.7", features = ["serde"], optional = true }
hashbrown = { version = "0.16", features = ["serde"], optional = true }
num-bigint = { version = "0.4", features = ["serde"], optional = true }
num-complex = { version = "0.4", features = ["serde"], optional = true }
rust_decimal = { version = "1.39", features = ["serde"], optional = true }
rust_decimal_macros = { version = "1.39", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
uuid = { version = "1.18", features = ["serde"], optional = true }

[dev-dependencies]
futures = "0.3"
trybuild = "1.0"

[features]
default = ["derive", "serde"]
derive = ["dep:memorypack-derive"]
extended_types = ["uuid", "rust_decimal", "rust_decimal_macros", "half", "num-bigint", "chrono", "glam", "num-complex", "url"]
