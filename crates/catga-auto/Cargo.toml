[package]
name = "catga-auto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed application facade for Catga event-driven runtimes"

[lints]
workspace = true

[features]
default = []
axum = ["dep:axum", "dep:catga-axum"]
nats = ["dep:catga-nats"]
redis = ["dep:catga-redis"]
flow = ["dep:catga-flow"]
cluster = ["dep:catga-cluster"]

[dependencies]
async-trait = "0.1"
catga-codec-memorypack = { workspace = true }
catga-core = { workspace = true }
axum = { version = "0.8", optional = true }
catga-axum = { workspace = true, optional = true }
catga-cluster = { workspace = true, optional = true }
catga-flow = { workspace = true, optional = true }
catga-nats = { workspace = true, optional = true }
catga-redis = { workspace = true, optional = true }
futures = "0.3"
metrics = "0.24"
tokio = { version = "1", features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
catga-codec-memorypack = { workspace = true }
catga-memory = { workspace = true }
catga-nats = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net"] }
