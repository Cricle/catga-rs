[package]
name = "catga-axum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
async-trait = "0.1"
catga-cluster = { path = "../catga-cluster", version = "0.1.0" }
catga-core = { path = "../catga-core", version = "0.1.0" }
futures = "0.3"
# Raft 0.7 (the newest compatible Raft release) exposes protobuf 2 message types.
protobuf = "2.28"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
