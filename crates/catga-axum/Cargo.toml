[package]
name = "catga-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Standalone axum server driver; Catga plugs its own mTLS acceptor into it, so its optional
# TLS integrations stay disabled.
axum-server = { version = "0.8", default-features = false }
async-trait = "0.1"
catga-cluster = { workspace = true }
catga-core = { workspace = true }
futures = "0.3"
http = "1"
# Raft 0.7 (the newest compatible Raft release) exposes protobuf 2 message types.
protobuf = "2.28"
# Development/demo certificate generation for mTLS tests and examples. The ring provider keeps
# the crypto backend identical to the rustls server configuration below.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
# An explicit provider is pinned because workspace feature unification enables both ring and
# aws-lc-rs on rustls, which would make the implicit-provider builders panic.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
# Parses the already TLS-verified client certificate for SAN URI / DNS / CN identities.
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
