[package]
name = "catga-memory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
test-hooks = []

[dependencies]
async-trait = "0.1"
arc-swap = "1"
catga-core = { path = "../catga-core", version = "0.1.0" }
catga-flow = { path = "../catga-flow", version = "0.1.0" }
dashmap = "6"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
