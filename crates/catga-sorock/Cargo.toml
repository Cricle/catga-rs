[package]
name = "catga-sorock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
catga-core = { workspace = true }
futures = "0.3"
# redb and tonic versions must match the ones sorock 0.12 builds against,
# because sorock types appear in this crate's public signatures.
redb = "3.1"
sorock = "=0.12.0"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tonic = "0.14"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
