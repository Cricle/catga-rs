[package]
name = "catga-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
streams-rpc = []

[dependencies]
async-trait = "0.1"
catga-codec-memorypack = { workspace = true }
catga-core = { workspace = true }
catga-flow = { workspace = true }
dashmap = "6"
futures = "0.3"
hex = "0.4"
redis = { version = "1", features = ["connection-manager", "tokio-comp"] }
serde = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
