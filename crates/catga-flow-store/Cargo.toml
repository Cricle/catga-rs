[package]
name = "catga-flow-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mssql = ["dep:bb8", "dep:bb8-tiberius", "dep:tiberius"]
redis = ["dep:catga-redis"]
tls-rustls = ["sqlx?/tls-rustls-ring-webpki", "bb8-tiberius?/tls"]

[dependencies]
async-trait = "0.1"
bb8 = { version = "0.9", optional = true }
bb8-tiberius = { version = "0.16", default-features = false, features = ["tds73", "with-tokio"], optional = true }
catga-core = { path = "../catga-core" }
catga-flow = { path = "../catga-flow" }
catga-redis = { path = "../catga-redis", optional = true }
sha2 = "0.10"
postcard = { version = "1", default-features = false, features = ["alloc"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"], optional = true }
tiberius = { version = "0.12", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
