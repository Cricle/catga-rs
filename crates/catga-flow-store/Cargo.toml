[package]
name = "catga-flow-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/mysql-rsa"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mssql = ["dep:bb8", "dep:bb8-tiberius", "dep:tiberius"]
redis = ["dep:catga-redis"]
tls-rustls = ["sqlx?/tls-rustls-ring-webpki", "bb8-tiberius?/tls"]

[dependencies]
async-trait = "0.1"
bb8 = { version = "0.9", optional = true }
bb8-tiberius = { version = "0.16", default-features = false, features = ["tds73", "with-tokio"], optional = true }
catga-core = { workspace = true }
catga-redis = { workspace = true, optional = true }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"], optional = true }
tiberius = { version = "0.12", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
url = "2"
