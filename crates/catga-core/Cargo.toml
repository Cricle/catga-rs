[package]
name = "catga-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
unstable = []
flow = []
uuid = ["dep:uuid"]
rust_decimal = ["dep:rust_decimal"]
half = ["dep:half"]
num-bigint = ["dep:num-bigint"]
chrono = ["dep:chrono"]
glam = ["dep:glam"]
num-complex = ["dep:num-complex"]
url = ["dep:url"]
hashbrown = ["dep:hashbrown"]
ahash = ["dep:ahash"]
fnv = ["dep:fnv"]
serde = []
test-hooks = []

[dependencies]
arc-swap = "1"
async-trait = { workspace = true }
base64 = "0.23"
bincode-next = { workspace = true }
byteorder = "1"
brotli = "8"
catga-core-macros = { path = "src/macros/proc-macros", version = "0.2.0" }
catga-memorypack-derive = { workspace = true }
dashmap = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = { workspace = true }
hmac = "0.13"
metrics = "0.24"
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
simdutf8 = { version = "0.1", features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"], optional = true }
chrono = { workspace = true, optional = true }
hashbrown = { version = "0.15", optional = true }
ahash = { version = "0.8", optional = true }
fnv = { version = "1.0", optional = true }
rust_decimal = { version = "1", optional = true }
half = { version = "2", features = ["std"], optional = true }
num-bigint = { version = "0.4", optional = true }
glam = { version = "0.27", optional = true }
num-complex = { version = "0.4", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
criterion = { workspace = true }
paste = "1"
uuid = { workspace = true }
hashbrown = "0.15"
ahash = "0.8"
chrono = { workspace = true }
rust_decimal = "1"
half = "2"
num-bigint = "0.4"

[[bench]]
name = "mediator_throughput"
harness = false

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "handler_dispatch"
harness = false

[[bench]]
name = "macro_expansion"
harness = false

[[bench]]
name = "flow_throughput"
harness = false

# Exercises every optional codec impl; skipped unless all are enabled
# (CI runs catga-core with --all-features).
[[test]]
name = "codec_memorypack"
required-features = ["uuid", "chrono", "glam", "url", "num-complex", "rust_decimal", "half", "num-bigint", "hashbrown", "ahash"]
