[package]
name = "catga-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
unstable = []
flow = []
uuid = ["dep:uuid"]
rust_decimal = ["dep:rust_decimal"]
half = ["dep:half"]
num-bigint = ["dep:num-bigint"]
chrono = ["dep:chrono"]
glam = ["dep:glam"]
num-complex = ["dep:num-complex"]
url = ["dep:url"]
hashbrown = ["dep:hashbrown"]
ahash = ["dep:ahash"]
serde = []
test-hooks = []

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.23"
bincode-next = "3"
byteorder = "1"
brotli = "8"
catga-core-macros = { path = "src/macros/proc-macros" }
catga-memorypack-derive = { workspace = true }
dashmap = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
hmac = "0.13"
metrics = "0.24"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
simdutf8 = { version = "0.1", features = ["std"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"], optional = true }
chrono = { version = "0.4", optional = true }
hashbrown = { version = "0.15", optional = true }
ahash = { version = "0.8", optional = true }
rust_decimal = { version = "1", optional = true }
half = { version = "2", features = ["std"], optional = true }
num-bigint = { version = "0.4", optional = true }
glam = { version = "0.27", optional = true }
num-complex = { version = "0.4", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
criterion = { version = "0.8", features = ["html_reports"] }
paste = "1"

[[bench]]
name = "mediator_throughput"
harness = false

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "handler_dispatch"
harness = false

[[bench]]
name = "macro_expansion"
harness = false

[[bench]]
name = "flow_throughput"
harness = false
