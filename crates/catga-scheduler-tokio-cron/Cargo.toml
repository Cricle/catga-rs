[package]
name = "catga-scheduler-tokio-cron"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in tokio-cron-scheduler adapter for bounded Catga flow due sweeps"

[lints]
workspace = true

[dependencies]
catga-core = { path = "../catga-core" }
catga-flow = { path = "../catga-flow" }
tokio-cron-scheduler = { version = "0.15.1", default-features = false }
tracing = "0.1"
uuid = "1"

[dev-dependencies]
catga-memory = { path = "../catga-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
