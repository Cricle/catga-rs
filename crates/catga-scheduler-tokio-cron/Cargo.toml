[package]
name = "catga-scheduler-tokio-cron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in tokio-cron-scheduler adapter for bounded Catga flow due sweeps"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
catga-core = { workspace = true }
catga-flow = { workspace = true }
tokio-cron-scheduler = { version = "0.15.1", default-features = false }
tracing = "0.1"
uuid = "1"

[dev-dependencies]
catga-memory = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
