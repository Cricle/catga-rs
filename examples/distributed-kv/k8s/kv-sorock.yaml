# Kubernetes manifests for the distributed-kv three-node cluster on the sorock
# backend (KV_BACKEND=sorock). This is a variant of kv.yaml — kv.yaml stays the
# raft default; apply this file to run the same workload on sorock multi-Raft.
#
# Differences from kv.yaml:
#   - all objects are renamed kv -> kv-sorock (KV_CLUSTER_NAME follows, so the
#     derived peer DNS becomes kv-sorock-<i>.kv-sorock-headless) and carry the
#     label app=distributed-kv-sorock, so both backends can run side by side;
#   - KV_BACKEND=sorock is set: consensus runs over gRPC on port 10100 (API
#     port + 1000) while the API port 9100 keeps serving KV + probes;
#   - the sorock-grpc port is declared on both the headless Service and the
#     container so peer URIs resolve through pod DNS.
#
# sorock 0.12 exposes no leadership query: /status always reports
# is_leader=false / leader_endpoint=null (see the crate docs). Probes and the
# KV API behave the same as on raft.
#
# Apply:  kubectl apply -f examples/distributed-kv/k8s/kv-sorock.yaml
# Verify: kubectl port-forward svc/kv-sorock-headless 9100:9100
#         curl -X POST localhost:9100/kv -H 'content-type: application/json' -d '{"key":"a","value":"1"}'
apiVersion: v1
kind: Service
metadata:
  name: kv-sorock-headless
  labels:
    app: distributed-kv-sorock
spec:
  clusterIP: None
  selector:
    app: distributed-kv-sorock
  ports:
    - name: api
      port: 9100
    # Consensus transport for the sorock backend (gRPC).
    - name: sorock-grpc
      port: 10100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv-sorock
  labels:
    app: distributed-kv-sorock
spec:
  serviceName: kv-sorock-headless
  replicas: 3
  selector:
    matchLabels:
      app: distributed-kv-sorock
  template:
    metadata:
      labels:
        app: distributed-kv-sorock
    spec:
      # Spread voters across nodes and zones so one node loss never kills quorum.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: distributed-kv-sorock
      containers:
        - name: kv
          image: localhost/catga-distributed-kv:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KV_CLUSTER_NAME
              value: kv-sorock
            - name: KV_REPLICAS
              value: "3"
            # Consensus backend: sorock multi-Raft over gRPC on port 10100.
            - name: KV_BACKEND
              value: sorock
          ports:
            - name: api
              containerPort: 9100
            # Consensus transport for the sorock backend (gRPC).
            - name: sorock-grpc
              containerPort: 10100
          readinessProbe:
            # The node answers once the HTTP API is up; the sorock group forms
            # imperatively behind it (bootstrap node self-adds, then joins peers).
            httpGet:
              path: /status
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            # /healthz returns 503 when the consensus runtime has stopped, so a
            # zombie pod (alive process, dead consensus loop) gets restarted.
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: raft-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: raft-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kv-sorock
  labels:
    app: distributed-kv-sorock
spec:
  # 3 voters tolerate exactly one loss; never evict two at once.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: distributed-kv-sorock
