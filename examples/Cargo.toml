[package]
name = "catga-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mediator"
path = "src/quickstart/mediator.rs"

[[bin]]
name = "typed_mediator"
path = "src/quickstart/typed_mediator.rs"

[[bin]]
name = "memory_transport"
path = "src/quickstart/memory_transport.rs"

[[bin]]
name = "flow"
path = "src/quickstart/flow.rs"

[[bin]]
name = "bus_cqrs"
path = "src/runtime/bus_cqrs.rs"

[[bin]]
name = "otel_bus"
path = "src/runtime/otel_bus.rs"

[[bin]]
name = "axum_checkout"
path = "src/web/axum_checkout.rs"

[[bin]]
name = "checkout"
path = "src/web/checkout.rs"

[[bin]]
name = "order_service"
path = "src/web/order_service.rs"

[[bin]]
name = "distributed_todo_api"
path = "src/distributed/todo_api.rs"

[[bin]]
name = "distributed_todo_worker"
path = "src/distributed/todo_worker.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
catga-auto = { workspace = true, features = ["axum"] }
catga-axum = { workspace = true }
catga-cluster = { workspace = true }
catga-codec-memorypack = { workspace = true }
catga-core = { workspace = true }
catga-flow = { workspace = true }
catga-memory = { workspace = true }
catga-nats = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
