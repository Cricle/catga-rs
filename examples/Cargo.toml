[package]
name = "catga-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
catga-axum = { workspace = true }
catga-cluster = { workspace = true }
catga-codec-memorypack = { workspace = true }
catga-core = { workspace = true }
catga-flow = { workspace = true }
catga-memory = { workspace = true }
catga-nats = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
